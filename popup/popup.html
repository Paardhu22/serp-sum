<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <title>serp-sum</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    
    body {
      width: 360px; height: 500px;
      background: #0f0f17;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      overflow: hidden;
      display: flex; flex-direction: column;
    }

    .header { padding: 16px 20px; border-bottom: 1px solid rgba(255,255,255,0.05); flex-shrink: 0; display: flex; align-items: center; justify-content: space-between; }
    .logo { font-size: 10px; font-weight: 800; letter-spacing: 1.5px; color: rgba(255,255,255,0.4); text-transform: uppercase; }

    /* Chat Container */
    .chat-container {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      background: rgba(255,255,255,0.02);
    }
    .chat-box {
      flex: 1;
      overflow-y: auto;
      padding: 16px 20px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      scrollbar-width: thin;
      scrollbar-color: rgba(255,255,255,0.1) transparent;
    }
    .chat-box::-webkit-scrollbar { width: 4px; }
    .chat-box::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 10px; }

    .chat-msg {
      max-width: 85%;
      padding: 10px 14px;
      font-size: 13px;
      line-height: 1.5;
      border-radius: 16px;
      word-wrap: break-word;
      animation: fadeIn 0.3s ease;
    }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }

    .chat-msg.bot {
      background: rgba(255,255,255,0.06);
      color: rgba(255,255,255,0.9);
      border: 1px solid rgba(255,255,255,0.08);
      border-bottom-left-radius: 4px;
      align-self: flex-start;
    }
    .chat-msg.user {
      background: rgba(255,255,255,0.14);
      color: #fff;
      border-bottom-right-radius: 4px;
      align-self: flex-end;
    }

    /* Input Area */
    .input-wrapper {
      padding: 14px 20px;
      background: rgba(0,0,0,0.2);
      border-top: 1px solid rgba(255,255,255,0.08);
      display: flex;
      gap: 10px;
      align-items: center;
    }
    .chat-input {
      flex: 1;
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 99px;
      padding: 10px 16px;
      color: #fff;
      font-size: 13px;
      outline: none;
      font-family: inherit;
      transition: all 0.2s;
    }
    .chat-input:focus { border-color: rgba(255,255,255,0.3); background: rgba(255,255,255,0.08); }
    
    .send-btn {
      background: rgba(255,255,255,0.9);
      color: #10101a;
      border: none;
      width: 34px; height: 34px;
      border-radius: 50%;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: all 0.2s ease;
      flex-shrink: 0;
    }
    .send-btn:hover { background: #fff; transform: scale(1.05); }
    .send-btn:active { transform: scale(0.95); }
    .send-btn:disabled { opacity: 0.3; }

    /* Footer Tools */
    .footer-tools {
      padding: 12px 20px;
      background: rgba(255,255,255,0.03);
      border-top: 1px solid rgba(255,255,255,0.05);
      display: flex;
      align-items: center; justify-content: space-between;
    }
    .tool-btn {
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 8px;
      padding: 6px 12px;
      color: rgba(255,255,255,0.7);
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
      display: flex; align-items: center; gap: 6px;
      transition: all 0.2s;
    }
    .tool-btn:hover { background: rgba(255,255,255,0.1); color: #fff; }
    
    .shortcut { font-size: 10px; color: rgba(255,255,255,0.2); display: flex; align-items: center; gap: 3px; }
    kbd { padding: 1px 4px; background: rgba(255,255,255,0.05); border-radius: 4px; border: 1px solid rgba(255,255,255,0.1); }
  </style>
</head>
<body>
  <div class="header">
    <div class="logo">serp-sum</div>
  </div>

  <div class="chat-container">
    <div class="chat-box" id="chatBox">
      <div class="chat-msg bot">Hi! I can help you summarize articles or answer questions. Try selecting text on any page for instant AI tools.</div>
    </div>
    
    <div class="input-wrapper">
      <input type="text" id="chatInput" class="chat-input" placeholder="Ask anything..." autocomplete="off"/>
      <button class="send-btn" id="chatSendBtn">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
      </button>
    </div>
  </div>

  <div class="footer-tools">
    <button class="tool-btn" id="snip">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><circle cx="8.5" cy="8.5" r="1.5"></circle><polyline points="21 15 16 10 5 21"></polyline></svg>
      Snip Mode
    </button>
    <div class="shortcut">
      <kbd>Ctrl</kbd><kbd>Shift</kbd><kbd>S</kbd>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
